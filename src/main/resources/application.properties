spring.application.name=meeting-scheduler-agent

spring.datasource.url=jdbc:mysql://localhost:3306/meeting_scheduler?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=vivek@2427

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false
server.port=8080

# Optional SMTP settings. Leave disabled for demo mode.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Optional LLM integration point. The included project works without an API key.
ai.provider=local
ai.api-key=${AI_API_KEY:}
