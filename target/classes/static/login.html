<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meeting Scheduler - Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 400px;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .logo {
            text-align: center;
            font-size: 45px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;

            border: 1px solid #ddd;
            border-radius: 8px;

            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;

            border: none;
            border-radius: 8px;

            background: #243b55;
            color: white;

            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #141e30;
        }

        .register {
            text-align: center;
            margin-top: 20px;
        }

        .register a {
            color: #243b55;
            font-weight: bold;
            text-decoration: none;
        }

        .error {
            color: red;
            text-align: center;
            margin-bottom: 15px;
        }

        .success {
            color: green;
            text-align: center;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="logo">📅</div>

    <h1>Meeting Scheduler</h1>

    <p class="subtitle">
        Login to your scheduling assistant
    </p>

    <div id="error" class="error"></div>
    <div id="success" class="success"></div>

    <form id="loginForm">

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Email"
            required>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Password"
            required>

        <button type="submit">
            Login
        </button>

    </form>

    <div class="register">
        Don't have an account?
        <a href="/register.html">
            Register
        </a>
    </div>

</div>

<script>

    document
        .getElementById("loginForm")
        .addEventListener("submit", async function (event) {

            // Prevent normal HTML form submission
            event.preventDefault();

            const email =
                document.getElementById("email").value;

            const password =
                document.getElementById("password").value;

            const error =
                document.getElementById("error");

            const success =
                document.getElementById("success");

            // Clear previous messages
            error.innerText = "";
            success.innerText = "";

            try {

                const response = await fetch(
                    "/api/auth/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            email: email,
                            password: password
                        })
                    }
                );

                const result =
                    await response.text();

                if (response.ok) {

                    success.innerText =
                        "Login successful!";

                    console.log(result);

                    // Redirect after successful login
                    setTimeout(function () {
                        window.location.href = "/";
                    }, 1000);

                } else {

                    error.innerText =
                        result || "Invalid email or password";
                }

            } catch (err) {

                console.error(err);

                error.innerText =
                    "Unable to connect to server";
            }

        });

</script>

</body>
</html>
