<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - Meeting Scheduler</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #141e30,
                    #243b55
                );

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .register-container {

            width: 420px;

            background: white;

            padding: 40px;

            border-radius: 15px;

            box-shadow:
                0 15px 40px
                rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        input {

            width: 100%;

            padding: 14px;

            margin-bottom: 15px;

            border: 1px solid #ddd;

            border-radius: 8px;

            font-size: 15px;
        }

        button {

            width: 100%;

            padding: 14px;

            background: #243b55;

            color: white;

            border: none;

            border-radius: 8px;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {
            background: #141e30;
        }

        .login {
            text-align: center;
            margin-top: 20px;
        }

        .login a {
            color: #243b55;
            font-weight: bold;
        }

        #message {
            text-align: center;
            margin-bottom: 15px;
        }

    </style>

</head>

<body>

<div class="register-container">

    <h1>📅 Create Account</h1>

    <p class="subtitle">
        Meeting Scheduler & Coordinator
    </p>

    <div id="message"></div>

    <form id="registerForm">

        <input
            type="text"
            id="name"
            placeholder="Full Name"
            required>

        <input
            type="email"
            id="email"
            placeholder="Email"
            required>

        <input
            type="password"
            id="password"
            placeholder="Password"
            required>

        <button type="submit">
            Create Account
        </button>

    </form>

    <div class="login">

        Already have an account?

        <a href="/login.html">
            Login
        </a>

    </div>

</div>

<script>

document
.getElementById("registerForm")
.addEventListener("submit", async function(e) {

    e.preventDefault();

    const data = {

        name:
            document.getElementById("name").value,

        email:
            document.getElementById("email").value,

        password:
            document.getElementById("password").value

    };

    const response =
        await fetch("/api/auth/register", {

            method: "POST",

            headers: {
                "Content-Type":
                    "application/json"
            },

            body: JSON.stringify(data)

        });

    const message =
        await response.text();

    const messageBox =
        document.getElementById("message");

    messageBox.innerText = message;

    if (response.ok) {

        messageBox.style.color = "green";

        setTimeout(() => {

            window.location.href =
                "/login.html";

        }, 1500);

    } else {

        messageBox.style.color = "red";

    }

});

</script>

</body>

</html>
